services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gesdem_db
      POSTGRES_USER: gesdem_user
      POSTGRES_PASSWORD: gesdem_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - back-tier

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://gesdem_user:gesdem_password@db:5432/gesdem_db
      PYTHONUNBUFFERED: 1
    volumes:
      - ./backend:/app
    networks:
      - back-tier
      - front-tier

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - front-tier

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  front-tier: {}
  back-tier: {}