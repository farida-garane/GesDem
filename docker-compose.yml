services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gesdem_db
      POSTGRES_USER: gesdem_user
      POSTGRES_PASSWORD: gesdem_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://gesdem_user:gesdem_password@db:5432/gesdem_db
      PYTHONUNBUFFERED: 1
    volumes:
      - ./backend:/app

volumes:
  postgres_data: